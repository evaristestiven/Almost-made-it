name: Package verified FOREST-29
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-forest29.yml', 'qa/forest29-overlay.b64']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forest29-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify the tested project
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,zipfile,io,base64,json,shutil
          root=Path('.')
          source=urllib.request.urlopen('https://raw.githubusercontent.com/evaristestiven/Almost-made-it/main/downloads/Almost-Made-It-FOREST-28.zip',timeout=120).read()
          assert hashlib.sha256(source).hexdigest()=='e9f9d2fe5bc431ed1b8e7a0b215fcc8b2a1d1aae56784314d3ef82205ec702d9'
          work=Path('/tmp/forest29-package/AlmostMadeIt-FOREST-29');work.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(source)) as z:
              assert z.testzip() is None
              for item in z.infolist():
                  name=item.filename.split('/',1)[1]
                  if not name or item.is_dir():continue
                  dest=work/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(z.read(item))
          data=base64.b64decode((root/'qa/forest29-overlay.b64').read_text())
          assert hashlib.sha256(data).hexdigest()=='e54a64b8913fc93e1cfbd8b558be634ee273b54f8c8dcde7ac5065559b45bb0e'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  dest=work/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(z.read(name))
          manifest=json.loads((work/'FOREST29_RUNTIME_SHA256.json').read_text())
          for name,digest in manifest.items():assert hashlib.sha256((work/name).read_bytes()).hexdigest()==digest,name
          for folder in work.glob('*-screenshots'):
              if folder.is_dir():shutil.rmtree(folder)
          for file in work.glob('START-HERE-*'):
              if file.name!='START-HERE-FOREST-29.txt':file.unlink()
          for file in work.glob('*MANIFEST.json'):file.unlink()
          for file in work.glob('*_RUNTIME_SHA256.json'):
              if file.name!='FOREST29_RUNTIME_SHA256.json':file.unlink()
          note='\nDELIVERY NOTE: This GitHub package reconstructs the verified runtime from the original asset archive and the exact tested source update. All 245 runtime/configuration files are SHA-256 checked. New gameplay screenshots remain in the execution workspace; they are not included in this delivery archive.\n'
          report=(work/'START-HERE-FOREST-29.txt').read_text()+note
          (work/'START-HERE-FOREST-29.txt').write_text(report)
          target=root/'downloads/Almost-Made-It-FOREST-29.zip'
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(work.rglob('*')):
                  if f.is_file() and '.godot' not in f.parts:z.write(f,f.relative_to(work.parent))
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              for name,digest in manifest.items():assert hashlib.sha256(z.read(work.name+'/'+name)).hexdigest()==digest,name
          checksum=hashlib.sha256(target.read_bytes()).hexdigest()
          (root/'downloads/Almost-Made-It-FOREST-29.sha256').write_text(checksum+'  '+target.name+'\n')
          (root/'downloads/FOREST29_REPORT.txt').write_text(report)
          print('VERIFIED',len(manifest),'runtime/configuration files;',target.stat().st_size,'bytes;',checksum)
          PY
      - name: Publish the verified download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Almost-Made-It-FOREST-29.zip downloads/Almost-Made-It-FOREST-29.sha256 downloads/FOREST29_REPORT.txt
          git commit -m "Publish verified FOREST-29 game project"
          git push origin HEAD:main
